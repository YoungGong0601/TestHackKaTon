#scr{position:relative;height:100%;aspect-ratio:9/16;background:#000;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 0 0 6px #111}
#screen{width:100%;height:100%;display:block;cursor:pointer}
.rip{position:absolute;width:46px;height:46px;margin:-23px;border-radius:50%;border:3px solid rgba(255,255,255,.85);pointer-events:none;animation:rip .45s ease-out forwards}

h2{font-size:13px;margin:6px 0 0;color:#b8ab98;font-weight:700}
.g{display:flex;flex-direction:column;gap:6px}
button{font:inherit;font-size:15px;padding:10px 12px;border:0;border-radius:6px;background:#4a4239;color:#fff;cursor:pointer;text-align:left}
button:hover{background:#5c5246}
button.p{background:#c8291f}
label{font-size:14px;display:flex;gap:8px;align-items:center}
#state{font-size:14px;line-height:1.6;background:#1c1916;padding:8px 10px;border-radius:6px}
#log{font-size:14px;line-height:1.5;background:#1c1916;padding:8px 10px;border-radius:6px;min-height:120px;max-height:240px;overflow:auto}
#log div{margin-bottom:4px;color:#d8cdbc}
#rc{display:none;width:150px;background:#f7f4ec;border-radius:3px}
#done{display:none;font-size:18px;font-weight:800;color:#f0c63a}

const THREE = (() => {
  class V { constructor() { this.x = 0; this.y = 0; this.z = 0; } set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; } }
  class Obj { constructor() { this.position = new V(); this.scale = new V(); this.rotation = new V(); this.visible = true; this.children = []; } add(c) { this.children.push(c); } }
  class Mesh extends Obj { constructor(g, m) { super(); this.geometry = g; this.material = m || { opacity: 0 }; } }
  class Plain { constructor(o) { Object.assign(this, o || {}); } }
  return { Group: Obj, Mesh, PlaneGeometry: Plain, MeshBasicMaterial: Plain, CanvasTexture: class { constructor(c) { this.image = c; } },
    AdditiveBlending: 2, SRGBColorSpace: 'srgb' };
})();

  flags: { mute: q.has('mute'), test: q.has('test'), start: q.get('start') },

};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const wait = (sec) => new Promise((r) => {
  const until = G.time + sec / (G.flags.fast || 1);
  G._waits.push({ until, r });
});
G._waits = [];
function tickWaits() {
  if (!G._waits.length) return;
  G._waits = G._waits.filter((w) => { if (G.time >= w.until) { w.r(); return false; } return true; });
}

return {G, clamp, damp, lerp, pick, rand, tickWaits, wait};
})();

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = null) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent?.add(m);
  return m;
}
function plane(w, h, mat, x = 0, y = 0, z = 0, parent = null, rx = 0, ry = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0); m.receiveShadow = true;
  parent?.add(m);
  return m;
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = null, seg = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  parent?.add(m);
  return m;
}
const std = (color, roughness = 0.8, metalness = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });

/** 캔버스로 그린 텍스처. draw(ctx,W,H) */
function canvasTex(W, H, draw) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  draw(c.getContext('2d'), W, H);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
/** 간판, 포스터: 캔버스 그림 평면. emissive>0 이면 스스로 빛남(블룸 대상) */
function signPlane(w, h, draw, { px = 512, emissive = 0, x = 0, y = 0, z = 0, parent = null, ry = 0 } = {}) {
  const t = canvasTex(px, Math.round(px * h / w), draw);
  const mat = new THREE.MeshStandardMaterial({ map: t, roughness: 0.65, emissiveMap: emissive ? t : null, emissive: emissive ? 0xffffff : 0, emissiveIntensity: emissive });
  const m = plane(w, h, mat, x, y, z, parent, 0, ry);
  return m;
}
const FONT = "'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif";
const font = (px, weight = 700) => `${weight} ${px}px ${FONT}`;

/** 패러디 로고: 왕관 쓴 번과 버거대왕 글자 */
function drawLogo(ctx, cx, cy, s, { text = true, dark = false } = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);

  }
  ctx.restore();
}

return {FONT, box, canvasTex, cyl, drawLogo, font, plane, signPlane, std};
})();

function T(c, s, x, y, size, o = {}) {
  c.font = fnt(size, o.w ?? 700); c.fillStyle = o.col ?? C.brown; c.textAlign = o.al ?? 'left'; c.textBaseline = o.base ?? 'alphabetic';
  if (o.max) { let z = size; while (c.measureText(s).width > o.max && z > 12) { z -= 1; c.font = fnt(z, o.w ?? 700); } }
  c.fillText(s, x, y);
}
function wrap(c, s, x, y, w, lh, size, o = {}) {
  c.font = fnt(size, o.w ?? 500); c.fillStyle = o.col ?? C.soft; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  let line = '';
  for (const ch of s) {
    if (c.measureText(line + ch).width > w) { c.fillText(line, x, y); y += lh; line = ch === ' ' ? '' : ch; } else line += ch;
  }
  c.fillText(line, x, y);
  return y;
}
function box(c, x, y, w, h, r, fill, stroke, lw = 2) {
  c.beginPath(); c.roundRect(x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}
function card(c, x, y, w, h, r = 10, fill = C.white) {
  c.save(); c.shadowColor = 'rgba(70,40,15,.18)'; c.shadowBlur = 14; c.shadowOffsetY = 5; box(c, x, y, w, h, r, fill); c.restore();
}
function lin(c, x0, y0, x1, y1, a, b) { const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function fitArt(c, img, x, y, w, h) {
  const s = Math.min(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
  c.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
function rays(c, cx, cy, col, n = 22, R = 1500) {
  c.save(); c.fillStyle = col;
  for (let i = 0; i < n; i++) { const a = i / n * 6.2832, b = a + 3.1416 / n; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); c.lineTo(cx + Math.cos(b) * R, cy + Math.sin(b) * R); c.closePath(); c.fill(); }
  c.restore();
}
const big = new Map();
function bigBurger(kind) {
  if (big.has(kind)) return big.get(kind);
  const cv = document.createElement('canvas'); cv.width = 1000; cv.height = 860;
  burger(cv.getContext('2d'), 500, 830, 840, kind);
  big.set(kind, cv);
  return cv;
}
// QR처럼 보이는 네모(가짜)
function fauxQR(c, x, y, s) {
  c.fillStyle = '#fff'; c.fillRect(x, y, s, s);
  const n = 25, u = (s - 16) / n; let v = 12345;
  c.fillStyle = '#2a1a10';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { v = (v * 1103515245 + 12345) & 0x7fffffff; if ((v >> 16) & 1) c.fillRect(x + 8 + i * u, y + 8 + j * u, u + 0.5, u + 0.5); }
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => {
    c.fillStyle = '#fff'; c.fillRect(x + 8 + a * u - u, y + 8 + b * u - u, u * 9, u * 9);
    c.fillStyle = '#2a1a10'; c.fillRect(x + 8 + a * u, y + 8 + b * u, u * 7, u * 7);
    c.fillStyle = '#fff'; c.fillRect(x + 8 + (a + 1) * u, y + 8 + (b + 1) * u, u * 5, u * 5);
    c.fillStyle = '#2a1a10'; c.fillRect(x + 8 + (a + 2) * u, y + 8 + (b + 2) * u, u * 3, u * 3);
  });
}

    $('log').appendChild(d); $('log').scrollTop = 1e9;
  };
  const NAMES = { kiosk: '키오스크', gp: '할아버지', staff: '알바생' };
  const noop = () => {};
  const audio = { play: noop, stop: noop };
  const ui = { say: (who, t) => { log(NAMES[who] || who || '', t); return Promise.resolve(); }, nunchi: noop, views: noop, prompt: noop };
  const nun = { v: 0, say(who, t) { log(NAMES[who] || who, t); return Promise.resolve(); }, mutter: noop, add: noop, sorry: noop, update: noop };
  const hands = { held: null, equip(v) { this.held = v; } };

  let scr = null, flow = null, finished = false;
  const sc = $('screen'), sx = sc.getContext('2d');
  const readables = { create(o) {
    return { mesh: new THREE.Mesh(), blur: o.blur, lensRadius: 0.15, mat: { uniforms: { glow: { value: 1 } } },
      redraw() { o.draw(sx, o.px, o.px * 16 / 9, false); if ($('c_mean').checked) o.draw(sx, o.px, o.px * 16 / 9, true); } };
  } };
  const ctx = { audio, ui, hands, readables };

  const K = M_flow.newK();
  const api = { redraw: () => scr && scr.redraw(), finish() { finished = true; $('done').style.display = 'block'; $('done').textContent = '주문 완료 ' + G.state.order.number; log('', '주문 완료'); sync(); }, onCall: noop };
  const hw = {
    coverOpened: false, plate: {},
    openCover() { this.coverOpened = true; sync(); },
    closeCover() { this.coverOpened = false; },
    cardHide: noop, nudge: noop, showPaperSpot: noop, update: noop,
    cardAt(slot, mode) { log('', '카드 ' + slot + ' ' + mode); },
    resetReceipt() { $('rc').style.display = 'none'; },
    printReceipt(draw) { draw($('rc').getContext('2d'), 296, 1000); $('rc').style.display = 'block'; },
    tearReceipt() { $('rc').style.display = 'none'; },
  };
  flow = M_flow.createFlow(ctx, K, hw, nun, api);
  scr = M_screens.createScreen(ctx, K, flow.A);
  api.scr = scr;
  // 안 먹는 터치 연출(눈치용)은 빼고 봇 입력으로 처리
  const touch = (px, py) => flow.touch(px, py, { bot: true });
  const spot = (id) => flow.spot(id, { bot: true });

  function sync() {
    $('state').innerHTML = '화면: ' + K.screen + '<br>덮개: ' + (hw.coverOpened ? '열림' : '닫힘') + '<br>합계: ' + M_data.won(K.total()) + (K.cardMsg ? '<br>' + K.cardMsg : '');
  }
  function reset() { finished = false; $('done').style.display = 'none'; $('log').innerHTML = ''; hands.equip(null); flow.resetAll(); K.timer = 90; sync(); }

  sc.addEventListener('click', (e) => {
    const r = sc.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * 1080, py = (e.clientY - r.top) / r.height * 1920;
    const d = document.createElement('div'); d.className = 'rip'; d.style.left = (e.clientX - r.left) + 'px'; d.style.top = (e.clientY - r.top) + 'px';
    $('scr').appendChild(d); setTimeout(() => d.remove(), 500);
    touch(px, py); sync();
  });
  $('b_cover').onclick = () => { spot('cover'); sync(); };
  $('b_ic').onclick = () => { spot('ic'); sync(); };
  $('b_bar').onclick = () => { spot('barcode'); sync(); };
  $('b_rec').onclick = () => { spot('receipt'); sync(); };
  $('b_out').onclick = () => { spot('ic'); sync(); };
  $('b_tear').onclick = () => { spot('paper'); sync(); };
  $('b_call').onclick = () => { spot('call'); sync(); };
  $('b_reset').onclick = reset;
  $('c_mean').onchange = () => scr.redraw();

  let last = performance.now(), slideT = 0, lastKey = '';
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    G.dt = dt; G.time += dt;
    M_g.tickWaits();
    flow.update(dt);
    if (K.screen === 'idle') { slideT += dt; if (slideT > 3.6) { slideT = 0; K.slide++; scr.redraw(); } }
    if ($('c_time').checked && flow.timed()) { K.timer -= dt; if (K.timer <= 0) { flow.timedOut(); sync(); } }
    const key = K.screen + K.cart.length + hw.coverOpened + K.cardMsg;
    if (key !== lastKey) { lastKey = key; sync(); }
    requestAnimationFrame(frame);
  }
  window.KIOSK = { K, flow, hw, scr, art: M_art, data: M_data, spot, touch, isDone: () => finished,
    buttons: () => scr.buttons.map((b) => b.id),
    press: (id) => { const b = scr.find(id); if (!b) return false; return touch(b.x + b.w / 2, b.y + b.h / 2); } };
  reset(); scr.redraw();
  requestAnimationFrame(frame);
})();

</script>
</body></html>
